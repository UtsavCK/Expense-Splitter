<div class="payment-create">
  <nav class="navbar">
    <div class="navbar-left">
      <button class="btn-back" routerLink="/">← Back</button>
      <h2>Record Payment</h2>
    </div>
  </nav>

  <div class="content">
    <div class="form-card">
      <div class="form-group">
        <label>Select Group (optional)</label>
        <select [(ngModel)]="selectedGroup" (change)="onGroupChange()">
          <option [value]="0">-- Select a group --</option>
          <option *ngFor="let group of groups" [value]="group.groupId">
            {{ group.name }}
          </option>
        </select>
        <small class="help-text">Selecting a group helps you choose who to pay</small>
      </div>

      <div class="form-group" *ngIf="selectedGroup && members.length > 0">
        <label>Pay To</label>
        <select [(ngModel)]="payment.paidTo">
          <option [value]="0">-- Select member --</option>
          <option *ngFor="let member of members" [value]="member.userId">
            User {{ member.userId }}
          </option>
        </select>
      </div>

      <div class="form-group" *ngIf="!selectedGroup || members.length === 0">
        <label>Pay To (User ID)</label>
        <input type="number" [(ngModel)]="payment.paidTo" placeholder="Enter user ID" />
        <small class="help-text">Note: User search by email requires backend enhancement</small>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>Amount</label>
          <input type="number" [(ngModel)]="payment.amount" placeholder="0.00" step="0.01" />
        </div>
        <div class="form-group">
          <label>Date</label>
          <input type="date" [(ngModel)]="payment.paymentDate" />
        </div>
      </div>

      <div class="form-group">
        <label>Notes</label>
        <textarea [(ngModel)]="payment.notes" rows="3" placeholder="What's this payment for?"></textarea>
      </div>

      <div class="action-buttons">
        <button class="btn-secondary" routerLink="/">Cancel</button>
        <button class="btn-primary" (click)="createPayment()" [disabled]="loading">
          <span class="icon">💰</span> 
          {{ loading ? 'Recording...' : 'Record Payment' }}
        </button>
      </div>
    </div>
  </div>
</div>
